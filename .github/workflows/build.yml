name: Autobuild
# modified from https://github.com/nosoop/NinjaBuild-SMPlugin/blob/master/contrib/github-workflow/build-on-version-tag-push.yml

on:
  push:
    tags:
    - 'v*'

jobs:
  run:
    name: Run action
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # skip build on '[ci skip]'
    if: "!contains(github.event.head_commit.message, '[ci skip]')"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: true

    - name: Setup SourcePawn Compiler
      uses: rumblefrog/setup-sp@master
      with:
        version: "1.12.x"

    - name: Fetch compile includes
      run: |
        mkdir -p extra-includes
        curl -fsSL -o extra-includes/autoexecconfig.inc https://raw.githubusercontent.com/Impact123/AutoExecConfig/master/autoexecconfig.inc
        curl -fsSL -o extra-includes/mge.inc https://raw.githubusercontent.com/maxijabase/MGEMod/master/addons/sourcemod/scripting/include/mge.inc
        curl -fsSL -o extra-includes/afk_manager.inc https://raw.githubusercontent.com/maxijabase/TF2-AFK-Manager/master/scripting/include/afk_manager.inc

    - name: Compile plugins
      run: |
        mkdir -p plugins
        spcomp -i"./extra-includes" scripting/mge_afk.sp -o ./plugins/mge_afk.smx
        ls -la plugins/

    - name: Zip packages
      run: |
        mkdir build
        7za a -r build/mge_afk.zip plugins/ scripting/
        ls -la
        pwd

    - name: Release
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: |
          ./build/mge_afk.zip
        fail_on_unmatched_files: true
        generate_release_notes: true
